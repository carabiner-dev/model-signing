name: go-tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions: {}

jobs:
  go-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.versions }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Determine Go versions
      id: versions
      uses: carabiner-dev/actions/go/versions@2f56fd66c5ef961f72bca3dbacbbfbd9acc717ee # main

    - name: Select supported Go versions
      id: matrix
      env:
        MINIMUM: ${{ steps.versions.outputs.GO_MINOR_VERSION_PROJECT }}
        PREVIOUS: ${{ steps.versions.outputs.GO_MINOR_VERSION_PREVIOUS }}
        STABLE: ${{ steps.versions.outputs.GO_MINOR_VERSION_STABLE }}
      run: |
        versions=$(jq -cn '
          (env.MINIMUM | split(".") | map(tonumber)) as $minimum
          | [env.PREVIOUS, env.STABLE]
          | map(select((split(".") | map(tonumber)) >= $minimum))
        ')
        echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    needs: go-versions
    name: Go Tests (go ${{ matrix.go-version }}, ${{ matrix.os }})
    permissions:
      contents: read

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ${{ fromJSON(needs.go-versions.outputs.matrix) }}
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
      fail-fast: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        cache: true

    - name: Test
      run: |
        go test -v ./... --cover
