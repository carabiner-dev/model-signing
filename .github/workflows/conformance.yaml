name: conformance

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions: {}

jobs:
  go-versions:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.versions.outputs.GO_VERSION_STABLE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine Go versions
        id: versions
        uses: carabiner-dev/actions/go/versions@d41fe10fe88deaf493ce026007da73738b9f570c # main

  conformance:
    name: OMS conformance suite
    needs: go-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.go-versions.outputs.stable }}
          cache: true

      - name: Build the conformance adapter
        run: go build -o bin/conformance ./test/conformance

      # Expected failures:
      #  - sigstore round trips sign against the sigstore staging instance,
      #    which the signer does not know.
      #  - bundles produced before OMS v1.1.0 identify keys by their bytes
      #    (rawBytes/keyDetails) instead of a hint, which the sigstore
      #    protobuf cannot represent, and v0.2.0 bundles use the deprecated
      #    predicate layout.
      - name: Run the OMS conformance suite
        uses: ossf/model-signing-spec/conformance@91bf841e8ccf97a3ed97309387e9298d1ac18ba2 # main
        with:
          entrypoint: ${{ github.workspace }}/bin/conformance
          xfail: |
            test_roundtrip[sigstore-ignore-paths]
            test_roundtrip[sigstore-multi-file]
            test_roundtrip[sigstore-sig-inside-model]
            test_roundtrip[sigstore-simple]
            test_roundtrip[sigstore-single-file]
            test_verify[historical/historical-v0.2.0-certificate]
            test_verify[historical/historical-v0.3.1-elliptic-key]
            test_verify[historical/historical-v1.0.0-elliptic-key]
            test_verify[historical/historical-v1.0.1-elliptic-key]

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: conformance-report
          path: conformance-report.json
